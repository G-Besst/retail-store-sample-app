name: Dev Env Workflow

on:
  push:
    branches:
      - develop

jobs:
  call-shared:
    uses: ./.github/workflows/shared-build-pipeline.yml
    with:
      environment: "development"
      imagename: "retailappui"
    
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME}}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD}}